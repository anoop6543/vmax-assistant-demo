    <title>VMAX Assistant | Vmax Power Controls Pvt Ltd</title>
    <script>
      // Pre-paint theme bootstrap (no flash): stored choice > OS > light.
      // Sets the `dark` class and matching backdrop on <html> before first paint.
      (function () {
        try {
          var t = null;
          try { t = JSON.parse(localStorage.getItem('vmax-v1-theme') || 'null'); } catch (e) { /* raw value fallback below */ }
          if (t !== 'light' && t !== 'dark') {
            var raw = localStorage.getItem('vmax-v1-theme');
            t = raw === 'dark' ? 'dark' : raw === 'light' ? 'light' : null;
          }
          var dark = t ? t === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
          root.style.backgroundColor = dark ? '#020617' : '#f8fafc';
        } catch (e) { /* storage unavailable — light default */ }
      })();
    </script>

  </head>
